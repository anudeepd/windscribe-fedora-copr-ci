# Service account for the privileged windscribe-helper service.
#
# Upstream creates this account in its %post with
#   groupadd windscribe
#   useradd -r -g windscribe -s /bin/false windscribe
# rpm creates it from this entry instead, before the payload is installed, so
# the %attr(2755,root,windscribe) on /opt/windscribe/Windscribe resolves.
#
# No separate "g windscribe" line: sysusers' "u" entries create the group of
# the same name implicitly, and declaring both makes rpm emit a duplicate
# group(windscribe) provides (rpmlint: useless-provides).
#
# The account exists only so the client binary can be group-owned by it (the
# helper itself runs as root). Upstream's useradd leaves the home unset (it
# defaults to /home/windscribe without ever creating it); /var/lib/windscribe
# is used here because that is the path the helper actually works in.

# Type Name        ID GECOS                     Home                Shell
u      windscribe  -  "Windscribe VPN service"  /var/lib/windscribe /bin/false
